name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  python-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        cd implementations/python
        pip install -e .

    - name: Build package
      run: |
        cd implementations/python
        python -m build

    - name: Check package
      run: |
        cd implementations/python
        twine check dist/*

    - name: Generate release notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "# Release Notes for v$VERSION" > RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Changes" >> RELEASE_NOTES.md
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          git log --pretty=format:"- %s" $LAST_TAG..HEAD >> RELEASE_NOTES.md
        else
          git log --pretty=format:"- %s" >> RELEASE_NOTES.md
        fi

    - name: Upload Python dist
      uses: actions/upload-artifact@v4
      with:
        name: python-dist
        path: implementations/python/dist/

    - name: Upload release notes
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: RELEASE_NOTES.md

    # Uncomment when ready to publish to PyPI
    # - name: Publish to PyPI
    #   env:
    #     TWINE_USERNAME: __token__
    #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    #   run: |
    #     cd implementations/python
    #     twine upload dist/*

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd vscode-extension
        npm ci

    - name: Compile TypeScript
      run: |
        cd vscode-extension
        npm run compile

    - name: Package extension (VSIX)
      run: |
        cd vscode-extension
        npx @vscode/vsce package --no-dependencies -o cfgpp-language-support.vsix

    - name: Publish to VS Code Marketplace
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
      run: |
        if [ -z "$VSCE_PAT" ]; then
          echo "VSCE_PAT secret not set — skipping VS Code Marketplace publish."
          echo "Add it at Settings → Secrets and variables → Actions to enable."
          exit 0
        fi
        cd vscode-extension
        npx @vscode/vsce publish --no-dependencies --packagePath cfgpp-language-support.vsix

    - name: Publish to Open VSX Registry
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      run: |
        if [ -z "$OVSX_PAT" ]; then
          echo "OVSX_PAT secret not set — skipping Open VSX publish."
          echo "Add it at Settings → Secrets and variables → Actions to enable."
          exit 0
        fi
        cd vscode-extension
        npx ovsx publish cfgpp-language-support.vsix -p "$OVSX_PAT"

    - name: Upload VSIX
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension
        path: vscode-extension/cfgpp-language-support.vsix

  release:
    runs-on: ubuntu-latest
    needs: [python-build, vscode-extension]
    steps:
    - name: Download Python dist
      uses: actions/download-artifact@v4
      with:
        name: python-dist
        path: release-assets/

    - name: Download VSIX
      uses: actions/download-artifact@v4
      with:
        name: vscode-extension
        path: release-assets/

    - name: Download release notes
      uses: actions/download-artifact@v4
      with:
        name: release-notes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: release-assets/*
